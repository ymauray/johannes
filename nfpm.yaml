name: johannes
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Yannick Mauray
description: Fabrique un livre (PDF et EPUB) à partir d'un fichier .docx, avec vérification typographique, Typst et Paige, écrit en .NET 10
homepage: https://github.com/ymauray/johannes
license: MIT

contents:
  - src: out/johannes
    dst: /usr/local/bin/johannes
    file_info:
      mode: 0755
